<div
  class="fixed top-0 left-0 z-200 w-screen h-screen flex flex-col items-center justify-start bg-white"
>
  <div class="w-full sticky top-0 left-0 z-201 flex flex-col items-center justify-center gap-0">
    <app-header></app-header>
    <app-navbar></app-navbar>
  </div>

  <div
    class="w-full h-full flex items-center justify-start gap-0 sm:gap-3 transition-all duration-300 relative"
  >
    <div
      [ngClass]="{
        'absolute top-3 left-3 z-150 flex items-center justify-center gap-3': getDataCollapsed,
        hidden: !getDataCollapsed,
      }"
    >
      <button
        (click)="openSideBar()"
        class="flex items-center justify-center p-2 cursor-pointer rounded-full hover:bg-black/10 transition-all duration-350 animation-fade"
      >
        <span class="akar-icons--sidebar-left"></span>
      </button>
    </div>
    <div
      class="transition-all duration-300 h-full"
      [ngClass]="{
        'absolute top-0 -translate-x-full': getDataCollapsed,
        'w-[50%] z-100 absolute sm:w-[40%] lg:w-[20%] lg:relative': !getDataCollapsed,
      }"
    >
      <app-sidebar (collapsed)="getCollapsed($event)"></app-sidebar>
    </div>
    <div
      class="w-full h-full flex items-end justify-center animation-fadeUp transition-all duration-300"
      [ngClass]="{ 'w-screen absolute': getDataCollapsed }"
    >
      <div class="p-10 mb-40">
        <app-ai-chat></app-ai-chat>
      </div>
    </div>
  </div>
</div>
