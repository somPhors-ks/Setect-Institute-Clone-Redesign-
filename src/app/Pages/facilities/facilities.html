<div class="w-screen flex flex-col items-center justify-center gap-3">
  <div
    class="relative w-screen h-60 sm:h-80 md:h-140 bg-[url('/Images/cover2.jpg')] bg-cover bg-center bg-no-repeat animation-fade"
  ></div>
  <div class="w-full flex flex-col items-center justify-center gap-10 px-5 m-5 sm:px-10 lg:px-20">
    <!-- Rooms -->
    @for (item of rooms; track item.id) {
      <div class="w-full flex flex-col items-start justify-center gap-3">
        <p
          class="text-[18px] sm:text-[22px] md:text-3xl text-[#00A86D] font-semibold animation-fadeUp"
        >
          {{ item.roomName }}
        </p>
        <p class="text-[10px] sm:text-[14px] md:text-[16px] text-justify animation-fadeUp">
          <span class="ml-10"></span> {{ item.desc }}
        </p>
        <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-3">
          @for (i of item.images; track i.id) {
            <div
              class="w-full flex items-center justify-center overflow-hidden drop-shadow-2xl rounded-2xl animation-fadeUp"
            >
              <img [src]="i.imageUrl" class="hover:scale-104 transition-all duration-350" />
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
