<div class="w-full h-full flex flex-col items-start justify-start gap-3 pt-3 bg-[#F5F5F5]">
  <div
    class="w-full bg-[#F5F5F5] p-3 drop-shadow-2xl text-[16px] text-center flex items-center justify-between gap-3 animation-fadeUp"
  >
    <p class="flex">SETEC Assistant</p>
    <button
      (click)="setCollasedSidebar()"
      class="flex items-center justify-center cursor-pointer p-2 rounded-full hover:bg-black/10 transition-all duration-350"
    >
      <span class="hugeicons--cancel-01"></span>
    </button>
  </div>
  <div class="w-full flex flex-col gap-2 mt-0 lg:mt-3 p-3">
    @for (menu of menuItems; track menu.id) {
      <button
        class="w-full p-3 flex items-center justify-start gap-3 rounded-2xl cursor-pointer hover:drop-shadow-md hover:bg-[#F5F5F5] transition-all duration-350 animation-fadeUp"
      >
        <span [className]="menu.icon"></span>
        <span class="text-[14px] flex">{{ menu.label }}</span>
      </button>
    }
  </div>
  <div class="w-full flex items-center justify-between gap-3 p-3">
    <p class="text-[12px] sm:text-[14px] text-black/50 animation-fadeUp">Recents</p>
    <button class="flex cursor-pointer text-black/50 animation-fadeUp">
      <span class="basil--caret-down-solid"></span>
    </button>
  </div>
</div>
