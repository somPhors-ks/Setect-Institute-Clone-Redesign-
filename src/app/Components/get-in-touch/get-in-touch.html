<div class="w-screen flex flex-col items-center justify-center gap-0 bg-[#F5F5F5] pb-10">
  <div
    class="w-screen relative flex flex-col items-center justify-center gap-3 bg-[#00A86D] p-5 pb-10"
  >
    <p class="text-[18px] sm:text-[22px] md:text-4xl text-white font-semibold animation-fadeUp">
      Get in Touch
    </p>
    <hr class="w-screen h-0.5 text-white/50" />
    <div
      class="absolute top-[90%] sm:bottom-[-60%] grid grid-cols-1 sm:grid-cols-3 items-center justify-center gap-3 px-5 sm:px-10 lg:px-20"
    >
      @for (item of getInTouchItems; track item.id) {
        <div
          class="p-3 rounded-2xl flex items-start justify-start gap-3 bg-white shadow-2xl hover:scale-101 transition-all duration-350 h-30 sm:h-38 lg:h-26 animation-fadeUp"
        >
          <div class="p-2 rounded-xl bg-[#00A86D] text-white flex items-center justify-center">
            <span [className]="item.icon"></span>
          </div>
          <div class="flex flex-col gap-1">
            <p class="text-[#00A86D] text-xl">{{ item.name }}</p>
            <p class="text-[12px] text-black/40">
              {{ item.desc }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>

  <div
    class="w-full flex flex-col items-center justify-center gap-5 mt-100 lg:mt-32 sm:mt-42 px-5 sm:px-10 lg:px-20"
  >
    <p
      class="w-full text-[18px] sm:text-[22px] md:text-3xl text-[#00A86D] font-semibold animation-fadeUp"
    >
      Location
    </p>
    <div class="w-full grid grid-cols-1 sm:grid-cols-2 items-center justify-center gap-3">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3908.7735342265505!2d104.89215657510023!3d11.568086088632976!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31095173761d4a53%3A0xcd09ff2f4d326e3f!2sSETEC%20Institute!5e0!3m2!1sen!2skh!4v1791001163861!5m2!1sen!2skh"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        class="w-full h-60 sm:h-full rounded-2xl shadow-2xl animation-fadeUp"
      ></iframe>
      <img src="Images/map.jpg" class="rounded-2xl shadow-2xl animation-fadeUp" />
    </div>
  </div>
</div>
