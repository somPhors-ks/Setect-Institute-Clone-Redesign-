<div
  class="w-screen flex items-center justify-between gap-3 bg-linear-to-r from-[#0C4A34] to-[#00A86D] py-3 px-5 sm:px-10 lg:px-20"
>
  <div class="flex items-center justify-center gap-3 animation-fade">
    <img [src]="logo" alt="logo" class="w-8 sm:w-16" />
    <div class="flex flex-col gap-1">
      <p class="text-[12px] sm:text-[18px] khmer-moul text-white">វិទ្យាស្ថាន ស៊ីតិក</p>
      <p class="text-[10px] sm:text-[12px] text-white">SETEC Institute</p>
    </div>
  </div>
  <div class="flex items-center justify-center gap-3 animation-fade">
    <div class="flex items-center justify-center gap-3">
      <a
        href="#"
        class="text-white hover:scale-104 hover:text-white/60 transition-all duration-350 hidden sm:flex items-center justify-center p-1"
      >
        <span class="akar-icons--facebook-fill"></span>
      </a>
      <a
        href="#"
        class="text-white hover:scale-104 hover:text-white/60 transition-all duration-350 hidden sm:flex items-center justify-center p-1"
      >
        <span class="akar-icons--telegram-fill"></span>
      </a>
    </div>
    <hr class="bg-white/40 text-white/40 w-0.5 h-16 hidden sm:flex" />
    <div class="flex items-center justify-center gap-3">
      <button
        class="flex items-center justify-center gap-2 text-white bg-white/40 p-1 sm:py-2 sm:px-6 rounded-full hover:text-white/60 hover:bg-white/30 transition-all duration-350 cursor-pointer"
      >
        <span class="griddy-icons--email-filled"></span>
        <p class="hidden sm:flex">Email</p>
      </button>
      <a
        routerLink="contactUs"
        class="flex items-center justify-center gap-2 text-white bg-white/40 p-1 sm:py-2 sm:px-6 rounded-full hover:text-white/60 hover:bg-white/30 transition-all duration-350 cursor-pointer"
      >
        <span class="boxicons--headphone-mic-filled"></span>
        <p class="hidden sm:flex">Contact</p>
      </a>
    </div>
  </div>
</div>
