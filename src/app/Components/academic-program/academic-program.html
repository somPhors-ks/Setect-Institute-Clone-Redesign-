<div class="w-screen flex flex-col items-center justify-center gap-3 px-5 sm:px-10 lg:px-20">
  <p class="text-[18px] sm:text-[22px] md:text-4xl text-[#00A86D] font-semibold">
    Academic Programs
  </p>
  <p class="text-[10px] sm:text-[14px] md:text-[16px] text-black/50 text-center animation-fadeUp">
    Begin Your Education With Us, End With Job Opportunity
  </p>
  <div class="grid grid-cols-1 lg:grid-cols-2 items-center justify-center gap-3">
    @for (p of programs; track $index) {
      <img
        [src]="p.programImage"
        class="hover:scale-101 transition-all duration-350 cursor-pointer animation-fadeUp"
      />
    }
  </div>
  <button
    class="flex items-center justify-center gap-3 text-white py-2 p-3 sm:py-3 sm:px-6 rounded-full text-[10px] sm:text-[14px] md:text-[16px] bg-[#00A86D] hover:bg-[#00A86D]/80 hover:scale-102 transition-all duration-350 cursor-pointer animation-fadeUp"
  >
    Explore More Program
    <span class="hidden sm:flex"><span class="akar-icons--arrow-right"></span></span>
  </button>
</div>
